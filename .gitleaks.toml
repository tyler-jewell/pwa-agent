title = "mac-studio-agents"

[extend]
useDefault = true

[[rules]]
id = "msa-vault-key"
description = "age identity / vault master key"
regex = '''AGE-SECRET-KEY-[A-Z0-9]+'''
tags = ["key", "age"]

[[rules]]
id = "claude-oauth-token"
description = "Claude Code OAuth / setup token"
regex = '''sk-ant-(oat|api)[0-9a-zA-Z_-]{20,}'''
tags = ["token", "claude"]
